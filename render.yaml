services:
  - type: web
    name: speedpulse
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Free external database (Turso). Render prompts for these on first sync; they are never stored in git.
      # Without them the app falls back to a local file, which is wiped on every restart on the free tier.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
